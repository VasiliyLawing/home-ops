name: Update flake.lock

# Manual fallback for refreshing inputs when Renovate is not doing it (no nix
# on the operator's workstation). Pushes a branch; open the PR by hand so CI
# runs on it: pull requests created with GITHUB_TOKEN do not trigger workflows.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake update
      - name: Push branch
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock already current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="chore/flake-lock-$(date +%Y%m%d)"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b "$branch"
          git commit -am "flake.lock: refresh nixpkgs + inputs"
          git push -f origin "$branch"
          echo "Pushed $branch: open a PR from it to run CI." >> "$GITHUB_STEP_SUMMARY"
