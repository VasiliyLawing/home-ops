name: Deploy media-node

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-media-node
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: homelab
    steps:
      - name: Refuse non-main refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploys only run from main (got ${{ github.ref }})" >&2
          exit 1

      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure deploy SSH key
        env:
          CLAN_SSH_PRIVATE_KEY: ${{ secrets.CLAN_SSH_PRIVATE_KEY }}
        run: |
          test -n "$CLAN_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$CLAN_SSH_PRIVATE_KEY" > ~/.ssh/home_ops_deploy_ed25519
          chmod 600 ~/.ssh/home_ops_deploy_ed25519
          cat > ~/.ssh/config <<'EOF'
          Host media-node media-node.*
            User root
            IdentityFile ~/.ssh/home_ops_deploy_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF

      - name: Deploy media-node
        run: nix run --inputs-from . nixpkgs#nixos-rebuild -- switch --flake .#media-node --target-host media-node
