name: Nix CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check flake
        run: nix flake check --no-build
      - name: Check Go helper scripts
        run: |
          nix shell --inputs-from . nixpkgs#go --command bash -c '
            set -euo pipefail
            while IFS= read -r -d "" module; do
              dir="$(dirname "$module")"
              echo "checking $dir"
              (
                cd "$dir"
                go test ./...
                go vet ./...
              )
            done < <(find machines/media-node/scripts/runtime-secrets -name go.mod -print0)
          '
      - name: Build media-node
        run: nix build .#nixosConfigurations.media-node.config.system.build.toplevel --no-link
