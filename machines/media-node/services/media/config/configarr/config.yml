# Configarr owns Sonarr/Radarr quality definitions, quality profiles, and
# TRaSH-Guides custom-format sync.
#
# Buildarr owns app wiring and public indexers.
# qBit Manage owns qBittorrent categories/tags/cleanup once enabled.

telemetry: false

sonarr:
  media-node:
    base_url: http://127.0.0.1:8989
    api_key: !env SONARR_API_KEY
    quality_definition:
      type: series
    include:
      - template: sonarr-quality-definition-series
      - template: sonarr-v4-quality-profile-web-1080p
      - template: sonarr-v4-custom-formats-web-1080p
    quality_profiles:
      - name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_score: 10000
          min_format_score: 100

radarr:
  media-node:
    base_url: http://127.0.0.1:7878
    api_key: !env RADARR_API_KEY
    quality_definition:
      type: movie
    include:
      - template: radarr-quality-definition-movie
      - template: radarr-quality-profile-hd-bluray-web
      - template: radarr-custom-formats-hd-bluray-web
