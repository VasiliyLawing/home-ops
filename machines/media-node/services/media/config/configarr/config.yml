# Configarr owns Sonarr/Radarr quality definitions, quality profiles, and
# TRaSH-Guides custom-format sync.
#
# Home Ops Prowlarr bootstrap owns Prowlarr app links and indexer proxies.
# Add actual Prowlarr indexers manually in the UI.
# qBit Manage owns qBittorrent categories/tags/cleanup once enabled.

telemetry: false

sonarr:
  media-node:
    base_url: http://127.0.0.1:8989
    api_key: !env SONARR_API_KEY
    quality_definition:
      type: series
    include:
      - template: sonarr-quality-definition-series
      - template: sonarr-v4-quality-profile-web-1080p
      - template: sonarr-v4-custom-formats-web-1080p
      - template: sonarr-v4-quality-profile-web-2160p
      - template: sonarr-v4-custom-formats-web-2160p
      - template: sonarr-v4-quality-profile-anime
      - template: sonarr-v4-custom-formats-anime
    quality_profiles:
      - name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_score: 10000
          min_format_score: 100
      - name: WEB-2160p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_score: 10000
          min_format_score: 100
      - name: Remux-1080p - Anime
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_score: 10000
          min_format_score: 100
      # Hand-rolled: TRaSH doesn't ship a broad "grab anything" TV profile.
      # Ordered for public-tracker reality, not raw quality: 1080p encodes
      # (WEB/Bluray) sit at the top because they're small (~2-4 GB/ep) and
      # actually well-seeded. REMUX tiers are demoted near the bottom — on
      # public indexers they're 20-40 GB with near-dead swarms and just jam
      # the download queue. 2160p is above remux but below 1080p encodes so
      # it's taken only when a good 1080p encode doesn't exist. Cutoff at
      # Bluray-1080p stops upgrade churn at the sweet spot.
      - name: Best Available
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
          min_format_score: 1
        quality_sort: top
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: HDTV-2160p
          - name: Bluray-1080p Remux
          - name: Bluray-2160p Remux
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities:
              - WEBDL-480p
              - WEBRip-480p
          - name: DVD
          - name: SDTV

radarr:
  media-node:
    base_url: http://127.0.0.1:7878
    api_key: !env RADARR_API_KEY
    quality_definition:
      type: movie
    include:
      - template: radarr-quality-definition-movie
      - template: radarr-quality-profile-hd-bluray-web
      - template: radarr-custom-formats-hd-bluray-web
      - template: radarr-quality-profile-uhd-bluray-web
      - template: radarr-custom-formats-uhd-bluray-web
      - template: radarr-quality-profile-remux-web-1080p
      - template: radarr-custom-formats-remux-web-1080p
      - template: radarr-quality-profile-remux-web-2160p
      - template: radarr-custom-formats-remux-web-2160p
      - template: radarr-quality-profile-anime
      - template: radarr-custom-formats-anime
    quality_profiles:
      - name: HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_score: 10000
          min_format_score: 100
      - name: UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_score: 10000
          min_format_score: 100
      - name: Remux + WEB 1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_score: 10000
          min_format_score: 100
      - name: Remux + WEB 2160p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_score: 10000
          min_format_score: 100
      - name: Remux-1080p - Anime
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_score: 10000
          min_format_score: 100
      # Hand-rolled: TRaSH doesn't ship a broad "grab anything" movie profile.
      # Full ladder: take whatever exists (down to SD/DVD as last resort) and
      # keep upgrading toward the top until Remux-2160p.
      - name: Best Available
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Remux-2160p
          until_score: 10000
          min_format_score: 1
        quality_sort: top
        qualities:
          - name: Remux-2160p
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: HDTV-2160p
          - name: Remux-1080p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities:
              - WEBDL-480p
              - WEBRip-480p
          - name: DVD-R
          - name: DVD
          - name: SDTV
